# CrewDesk — nginx site configuration (HTTP only)
# Install as /etc/nginx/sites-available/crewdesk
#
# SAME-ORIGIN setup: nginx serves the built React app and proxies the API paths to
# the NestJS process listening on 127.0.0.1:3000, so the browser never makes a
# cross-origin request and TLS terminates in one place.
#
# Replace every occurrence of crewdesk.example.com with your real domain.
# After `certbot --nginx` runs, this file gains the HTTPS server block and redirect.

upstream crewdesk_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

# --- How routing works here --------------------------------------------------
# The NestJS controllers own these top-level paths (backend/src/*/*.controller.ts):
#   /auth  /users  /projects  /tasks  /groups  /social-links  /docs
# Nginx matches a prefix location by longest match, so `/users/me` hits the proxy
# while `/dashboard/users` (a React Router page) falls through to the SPA fallback.
# A bare `/users` (no trailing slash) does NOT match `location /users/`, which is
# why the exact-match blocks below exist.

server {
    listen 80;
    listen [::]:80;
    server_name crewdesk.example.com;

    root /var/www/crewdesk;
    index index.html;

    # The API accepts JSON only, so keep the request body cap small.
    client_max_body_size 1m;

    access_log /var/log/nginx/crewdesk.access.log;
    error_log  /var/log/nginx/crewdesk.error.log;
    server_tokens off;

    # --- Shared proxy headers, inherited by every proxy_pass below -----------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # =====================================================================
    # 1) API — prefix locations (paths WITH a trailing segment)
    # =====================================================================
    location /auth/         { proxy_pass http://crewdesk_api; }
    location /users/        { proxy_pass http://crewdesk_api; }
    location /projects/     { proxy_pass http://crewdesk_api; }
    location /tasks/        { proxy_pass http://crewdesk_api; }
    location /groups/       { proxy_pass http://crewdesk_api; }
    location /social-links/ { proxy_pass http://crewdesk_api; }
    location /media/        { proxy_pass http://crewdesk_api; }
    location /opportunities/ { proxy_pass http://crewdesk_api; }

    # =====================================================================
    # 2) API — exact matches (bare collection paths with no trailing slash)
    # =====================================================================
    location = /auth         { proxy_pass http://crewdesk_api; }
    location = /users        { proxy_pass http://crewdesk_api; }
    location = /projects     { proxy_pass http://crewdesk_api; }
    location = /tasks        { proxy_pass http://crewdesk_api; }
    location = /groups       { proxy_pass http://crewdesk_api; }
    location = /social-links { proxy_pass http://crewdesk_api; }
    location = /media        { proxy_pass http://crewdesk_api; }
    location = /opportunities { proxy_pass http://crewdesk_api; }

    # =====================================================================
    # 3) Swagger UI at /docs
    #    It is NOT protected by the API — the basic-auth middleware in
    #    backend/src/main.ts is commented out. Prefer the protected version.
    # =====================================================================

    # (a) Protected: create the password file first with
    #     sudo htpasswd -c /etc/nginx/.htpasswd-crewdesk-docs docsadmin
    #     (install `apache2-utils` if htpasswd is missing), then swap the blocks.
    #
    # location /docs {
    #     auth_basic           "CrewDesk API docs";
    #     auth_basic_user_file /etc/nginx/.htpasswd-crewdesk-docs;
    #     proxy_pass http://crewdesk_api;
    # }

    # (b) Exposed: simplest, but anyone on the internet can read the API schema.
    location /docs { proxy_pass http://crewdesk_api; }

    # =====================================================================
    # 4) Hashed build assets — immutable, cache for a year
    # =====================================================================
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # Repeated here because any add_header in a location cancels the
        # inherited server-level add_header directives.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # =====================================================================
    # 5) Self-hosted fonts.
    #    This block is REQUIRED, not cosmetic: the font file lives in a
    #    subdirectory, so the root-level static allow-list below does not match it
    #    and the SPA fallback would answer /fonts/... with index.html. The browser
    #    would then reject the font (wrong MIME type) and every Persian screen would
    #    silently fall back to system fonts — a failure that is easy to miss because
    #    the site still looks broadly fine.
    #
    #    Font files are not content-hashed, so they get a moderate cache rather than
    #    the immutable one used for /assets/.
    # =====================================================================
    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Fonts are cross-origin readable only with this header; harmless here and
        # needed if the font is ever served from the API host.
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # =====================================================================
    # 6) SPA fallback — real files win, then a prerendered page for that exact
    #    path, then the app shell so React Router handles client-side routes.
    #    The build prerenders public routes to <route>/index.html, so crawlers
    #    get fully rendered HTML and visitors get one extra file lookup.
    # =====================================================================
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    # Never let clients cache the HTML shell or prerendered pages; they reference
    # hashed bundles, so a stale copy pins visitors to an old release.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # =====================================================================
    # 7) Prerendered routes: /about/index.html, /education/index.html, ...
    # =====================================================================
    location ~ ^/(?:about|education|gallery|cooperation|donations|events|login|register|dashboard|groups)/index\.html$ {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # Crawler files generated at build time. Exact matches so they can never be
    # swallowed by the SPA fallback and accidentally served as index.html.
    location = /robots.txt {
        expires 1d;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        expires 1h;
        try_files $uri =404;
    }

    # Icons and the web app manifest. Exact or allow-listed matches so a missing icon
    # returns a real 404 instead of the SPA shell, which would look to the browser like a
    # corrupt image rather than a missing one.
    #
    # /favicon.ico is requested by browsers even when an SVG icon is declared. nginx's
    # default mime.types already maps ico and webmanifest, so no default_type override is
    # needed; declare `types { image/x-icon ico; }` in the http block if an unusual build
    # of nginx lacks them.
    location = /favicon.ico {
        expires 30d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        expires 1h;
        try_files $uri =404;
    }

    # Remaining root-level static files: /favicon.svg, /favicon-*.png,
    # /apple-touch-icon.png, /android-chrome-*.png, /og-image.png, ...
    # Deliberately an allow-list. A blanket `\.(css|js)$` rule would also match Swagger's
    # own files under /docs/ and break the docs page.
    location ~ ^/(?:favicon|logo|apple-touch-icon|android-chrome|og-image|robots|sitemap|manifest|browserconfig)[^/]*\.(?:svg|png|ico|jpg|jpeg|gif|webp|css|js|txt|xml|webmanifest|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # --- Security headers for everything not covered above ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
